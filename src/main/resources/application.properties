spring.config.import=optional:file:.env[.properties]

# Spring Configs
spring.application.name=tca
server.port=7057

# JPA Configs
spring.datasource.url=${SP_HOST}
spring.datasource.username=${SP_USERNAME}
spring.datasource.password=${SP_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false


# JWT Key
tca.security.token-secret=${JWT_SECRET_KEY}

# CustomKeys
tca.email.send=${SEND_EMAIL}

# Maileroo Configuration
tca.email.smtp-host=${SMTP_HOST}
tca.email.smtp-password=${SMTP_PASSWORD}
tca.email.smtp-sending-key=${SMTP_SENDING_KEY}
tca.email.smtp-base-url=https://smtp.maileroo.com/api/v2


# Python Microservice
tca.ai.host.url=${PY_HOST_URL}
tca.ai.host.secret-key=${PY_SECRET_KEY}